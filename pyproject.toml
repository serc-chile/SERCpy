[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sercpy"
version = "0.1.0"
description = "Python library for simulating solar thermal energy systems"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "pandas>=2.3",
    "scipy>=1.16",
    "matplotlib>=3.10",
    "coolprop>=6.7",
    "pvlib>=0.13",
    "timezonefinder>=8.3",
    "pyperclip>=1.11"
]